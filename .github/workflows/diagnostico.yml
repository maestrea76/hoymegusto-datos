name: Diagnostico semanal

# El jefe revisa el panel cada martes a las 10:23 Europe/Madrid.
# Cron en UTC: 09:23 Madrid CEST = 07:23 UTC; en CET (invierno) = 08:23 UTC.
# GitHub Actions atrasa a menudo 1–3 h el schedule (ver estadisticas.yml ~18:00→20:00 UTC),
# así que NO filtramos por hora Madrid en el script: si el cron dispara, generamos.
on:
  schedule:
    - cron: "23 7 * * 2"   # Tue 07:23 UTC = 09:23 CEST
    - cron: "23 8 * * 2"   # Tue 08:23 UTC = 10:23 CEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar briefing
        run: python diagnostico_semanal.py

      - name: Guardar
        run: |
          git config user.name "hoymegusto-bot"
          git config user.email "estadisticas@github.com"
          git add datos/diagnostico_semanal.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Diagnostico semanal $(date -u +%G-W%V)"
          git pull --rebase origin main
          git push
