name: Diagnostico semanal

# El jefe revisa el panel cada martes a las 10:00 Europe/Madrid.
# GitHub Actions entrega este schedule ~7 h tarde (29/09 y 06/10: 09:00/10:00 -> ~16:00/16:50),
# así que se programa el lunes por la noche para que llegue antes de la revisión.
# Respaldo: dispatch manual el martes a las 10:00. El script no filtra por hora.
on:
  schedule:
    - cron: "41 20 * * 1"   # Lun 20:41 UTC = 22:41 Madrid CEST (llega ~7 h tarde; respaldo: dispatch manual martes 10:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar briefing
        run: python diagnostico_semanal.py

      - name: Guardar
        run: |
          git config user.name "hoymegusto-bot"
          git config user.email "estadisticas@github.com"
          git add datos/diagnostico_semanal.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Diagnostico semanal $(date -u +%G-W%V)"
          git pull --rebase origin main
          git push
