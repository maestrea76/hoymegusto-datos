name: Bot - comentarios y DMs

# Comentarios nuevos (IG + FB, últimos 14 días) y DMs de IG. Abre un issue aviso-bot (solo ids y enlaces) si hay algo nuevo.
# 13:00 y 21:00 Madrid: 11:00/19:00 UTC en verano (CEST) y 12:00/20:00 UTC en invierno (CET).
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      seco:
        description: "En seco: no abre issues (solo escribe en el log lo que abriría)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-comentarios

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar comentarios y DMs nuevos
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECO: ${{ github.event.inputs.seco }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python automatizaciones/comentarios.py
      - name: Guardar
        run: |
          git config user.name "hoymegusto-bot"
          git config user.email "estadisticas@github.com"
          git add datos/comentarios-vistos.json
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "comentarios-vistos: revision $(TZ=Europe/Madrid date +%F\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Avisar al bot si algo falla
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECO: ${{ github.event.inputs.seco }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f /tmp/aviso_error_enviado ]; then echo "Error ya avisado"; exit 0; fi
          python automatizaciones/comun.py error "{\"origen\": \"${{ github.workflow }}\", \"mensaje\": \"La Action ha fallado\", \"run\": \"$RUN_URL\"}"
