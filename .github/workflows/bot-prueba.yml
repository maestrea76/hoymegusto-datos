name: Bot - prueba del aviso

# Manual: abre un issue «aviso-bot: prueba <fecha>» (etiqueta aviso-bot, asignado a maestrea76)
# para comprobar que el bot se despierta al asignarse el issue.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abrir issue de prueba
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python automatizaciones/comun.py prueba '{"mensaje": "Prueba manual desde GitHub Actions"}'
